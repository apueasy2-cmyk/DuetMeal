# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Point Gradle directly to the complete Android Studio JDK (JBR) with jlink.exe
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Disable configuration-cache if encountering AGP transform caching serialization issues
org.gradle.configuration-cache=false

kotlin.code.style=official